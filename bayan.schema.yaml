# Rime schema
# encoding: utf-8
#
# Derived from Bopomofo_Eten26_Rime by Lou (MIT):
# https://github.com/loustack17/Bopomofo_Eten26_Rime

schema:
  schema_id: bayan
  name: 伯顏
  version: "0.1.0"
  author:
    - Bayanasar Khurd
    - "Lou <https://github.com/loustack17>"
  description: |
    注音 26 鍵排佈，聲母按拼音字母擺放。
    z=ㄗㄓ c=ㄘㄔ s=ㄙㄕ 同鍵，由候選區分。
    空格送出，一聲不按鍵，聲調可省略。
  dependencies:
    - terra_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: ["中", En]
  - name: full_shape
    reset: 0
    states: ["半形", "全形"]
  - options: [zh_hant_tw, zh_hans]
    reset: 0
    states: ["繁體", "簡體"]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier@zh_hans
    - simplifier@zh_hant_tw
    - uniquifier

menu:
  alternative_select_keys: "1234567890"
  page_size: 9

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz"
  finals: "fjkd"
  delimiter: "'"
  algebra:
    # terra_pinyin syllables to one internal letter per zhuyin symbol.
    - xform/^m(\d)$/mu$1/
    - xform/^r5$/er5/
    - xform/iu/iou/
    - xform/ui/uei/
    - xform/ong/ung/
    - xform/^yi?/i/
    - xform/^wu?/u/
    - xform/iu/v/
    - xform/^([jqx])u/$1v/
    - xform/([iuv])n/$1en/
    - xform/^zhi?/Z/
    - xform/^chi?/C/
    - xform/^shi?/S/
    - xform/^([zcsr])i/$1/
    - xform/ai/A/
    - xform/ei/I/
    - xform/ao/O/
    - xform/ou/U/
    - xform/ang/K/
    - xform/eng/G/
    - xform/an/M/
    - xform/en/N/
    - xform/er/R/
    - xform/eh/E/
    - xform/([iv])e/$1E/
    # Tone 1 has no key: a bare syllable is an exact tone 1.
    - xform/1$//
    # terra_pinyin writes some words with a neutral tone (早上 zao3 shang5), and
    # a typist gives the character's own tone, so neutral answers to tones 2-4.
    - fuzz/5$/2/
    - fuzz/5$/3/
    - fuzz/5$/4/
    # Any tone can be left out. This is fuzz, not abbrev: librime drops an
    # abbreviation as soon as an exact path exists, and a bare syllable is exact
    # for tone 1, so with abbrev 國家 could not be typed as guojia at all.
    - fuzz/^([A-Za-z]+)\d$/$1/
    # Spellings with no single-syllable entry, such as yi5 and ban2. Left in, they
    # count as exact, so librime drops the path reading the tone key as the next
    # initial and finds nothing to offer. Words using them stay findable through
    # the rules above. Generated by tests/dead_spellings.py.
    - erase/^(C5|CA5|CG5|CK5|CM5|CN5|CO5|Ca5|Ce5|CuK5|CuN4|CuN5|Cuo2|Cuo3|Cuo5|SA2|SA5|SG5|SM5|SN5|SO5|SU5|Sa5|Se5|Su5|SuI5|SuN2|SuN5|Sua2|Sua5|Suo2|Suo3|Suo5|Z5|ZG2|ZG5|ZK2|ZK5|ZM5|ZO5|ZU5|Za5|Zu5|ZuG2|ZuG5|ZuI2|ZuI5|ZuK2|ZuK5|ZuM2|ZuM5|Zua2|Zua4|Zua5|Zuo3|Zuo5|bA5|bG5|bK2|bK5|bM2|bM5|bN2|bN5|bO5|biE5|biG2|biG5|bu5|cA5|cG3|cG5|cK3|cuN5|cuo5|dA2|dA5|dG2|dG5|dK2|dK5|dM2|dM5|dO5|dU2|dU5|di5|diE5|diG2|diG5|diM5|diO2|diO5|du5|duG2|duG5|duI2|duI5|duN2|duN5|fG5|fI5|fK5|fM5|fN5|fa5|fu5|gA2|gA5|gI2|gI4|gI5|gK2|gK5|gM2|gM5|gO2|gO5|gU2|gU5|ga5|gu5|guA2|guA5|guG2|guG5|guI2|guI5|guK2|guK5|guN2|guN5|gua5|guo5|hA5|hG3|hG5|hI3|hK3|hK5|hN5|hO5|hU5|ha5|he5|huG5|huI5|huK5|huM5|huN5|hua3|hua5|huo5|i5|iE5|iG5|iK5|iM5|iN5|iO5|iU5|ji5|jiG2|jiG5|jiK2|jiK5|jiM2|jiM5|jiN2|jiN5|jiO5|jia5|jv5|kA2|kA5|kM2|kM5|kN2|kN5|kO2|kO5|kU2|kU5|ka4|ke5|ku5|kuA2|kuA5|kuG2|kuG5|kuK5|lA5|lG5|lK5|lM5|liE5|liG5|liK5|liM5|liO5|liU5|lu5|luG5|luM5|lvM|lvM2|lvM3|mA5|mG5|mI5|mK5|mM5|mO5|miG5|miM5|mo5|mu5|nA5|nK5|nM5|nN2|nN3|nN5|nO5|niE5|niK5|niM5|niU5|nuG5|pA3|pA5|pG5|pM5|pN5|pa5|po5|qi5|qiE5|qiG5|qiK5|qiM5|qiN5|qiO5|qiU5|qv5|qvM5|qvN4|qvN5|rK5|rM5|rN5|rU5|re2|re5|ruG5|s5|sK2|sK5|sO2|sO5|sU2|sU5|se2|se3|se5|su5|suG5|suI5|suM2|suM5|suo5|tA5|tG3|tG5|tK5|tM5|tO5|ti5|tiE5|tiG5|tiM5|tiO5|tuG5|tuN5|tuo5|u5|uI5|uK5|uN5|v5|vE5|vG5|vM5|xi5|xiE5|xiG5|xiK5|xiM5|xiN5|xiO5|xia5|xvG5|xvM5|xvN3|xvN5|zA2|zA5|zM5|zO5|zU2|zU5|za4|za5|zuG2|zuI5)$/
    # Initial only.
    - abbrev/^([bpmfdtnlgkhjqxZCSrzcs]).+$/$1/
    # Internal letters to keys:
    #   ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ ㄧㄨㄩ ㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ ˊˇˋ˙
    - xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR2345|bpmfdtnlgkhjqxzcsrzcsiuvaoeeiywpmntlrfjkd|

editor:
  bindings:
    space: commit_composition
    Return: confirm
    KP_Enter: confirm

translator:
  dictionary: terra_pinyin
  prism: bayan
  spelling_hints: 0
  comment_format: []
  enable_sentence: true
  enable_completion: true
  enable_user_dict: true
  enable_encoder: true
  encode_commit_history: true
  sentence_over_completion: true
  # The preedit is always zhuyin, never a key letter. One key can stand for two
  # symbols; where the keys typed cannot settle which, show the commoner: ㄓㄔㄕ
  # over ㄗㄘㄙ, ㄧ over ㄞ, ㄖ over ㄦ. Alternation, not [ㄐㄑㄒ]: Rime's regex
  # matches UTF-8 bytes.
  preedit_format:
    # Keys that are only ever initials.
    - xform/z/ㄓ/
    - xform/c/ㄔ/
    - xform/s/ㄕ/
    - xform/b/ㄅ/
    - xform/g/ㄍ/
    - xform/h/ㄏ/
    - xform/q/ㄑ/
    - xform/x/ㄒ/
    # A tone key at the start of a syllable is an initial.
    - xform/(^|')f/$1ㄈ/
    - xform/(^|')d/$1ㄉ/
    - xform/(^|')j/$1ㄐ/
    - xform/(^|')k/$1ㄎ/
    # A shared key at the start of a syllable is an initial if more follows.
    - xform/(^|')p([iwuaoeyvpmntlr])/$1ㄆ$2/
    - xform/(^|')m([iwuaoeyvpmntlr])/$1ㄇ$2/
    - xform/(^|')n([iwuaoeyvpmntlr])/$1ㄋ$2/
    - xform/(^|')t([iwuaoeyvpmntlr])/$1ㄊ$2/
    - xform/(^|')r([iwuaoeyvpmntlr])/$1ㄖ$2/
    - xform/(^|')l/$1ㄌ/
    # i: ㄧ before a final or after ㄐㄑㄒ; ㄞ where ㄧ cannot follow.
    - xform/ii/ㄧㄞ/
    - xform/i([aoeywpmntlr])/ㄧ$1/
    - xform/(ㄐ|ㄑ|ㄒ)i/$1ㄧ/
    - xform/(ㄍ|ㄎ|ㄏ|ㄓ|ㄔ|ㄕ|u)i/$1ㄞ/
    - xform/i/ㄧ/
    # e: ㄝ after ㄧㄩ, else ㄜ.
    - xform/v/ㄩ/
    - xform/ㄧe/ㄧㄝ/
    - xform/ㄩe/ㄩㄝ/
    - xform/e/ㄜ/
    - xform/u/ㄨ/
    - xform/a/ㄚ/
    - xform/o/ㄛ/
    - xform/w/ㄠ/
    - xform/y/ㄟ/
    # Whatever is left of the shared keys sits in final position.
    - xform/p/ㄡ/
    - xform/m/ㄢ/
    - xform/n/ㄣ/
    - xform/t/ㄤ/
    - xform/l/ㄥ/
    - xform/([^'])r/$1ㄦ/
    - xform/r/ㄖ/
    - xform/f/ˊ/
    - xform/j/ˇ/
    - xform/k/ˋ/
    - xform/d/˙/
    - xform/'//

punctuator:
  full_shape: &zh_punct
    "/": {commit: "、"}
    ",": {commit: "，"}
    .: {commit: "。"}
    ";": {commit: "；"}
    ":": {commit: "："}
    "?": {commit: "？"}
    "!": {commit: "！"}
    "\"": {pair: ["“", "”"]}
    "'": {pair: ["‘", "’"]}
    "(": {commit: "（"}
    ")": {commit: "）"}
    "[": {commit: "［"}
    "]": {commit: "］"}
    "{": {commit: "｛"}
    "}": {commit: "｝"}
    "<": {commit: "《"}
    ">": {commit: "》"}
    "@": {commit: "＠"}
    "#": {commit: "＃"}
    "$": {commit: "＄"}
    "%": {commit: "％"}
    "^": {commit: "＾"}
    "&": {commit: "＆"}
    "*": {commit: "＊"}
    "-": {commit: "－"}
    _: {commit: "＿"}
    "+": {commit: "＋"}
    "=": {commit: "＝"}
    "\\": {commit: "＼"}
    "|": {commit: "｜"}
    "`": {commit: "｀"}
    "~": {commit: "～"}
  half_shape: *zh_punct

key_binder:
  import_preset: default

recognizer:
  patterns:
    email: "^[a-z][-_.0-9a-z]*@.*$"
    uppercase: "^[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp:|mailto:).*$"

zh_hans:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: all

zh_hant_tw:
  option_name: zh_hant_tw
  opencc_config: t2tw.json
  tips: none
